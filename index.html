  if(!S.seeded){var have={};S.sessions.forEach(function(s){have[s.id]=1});SEED.forEach(function(s){if(!have[s.id])S.sessions.push(s)});S.seeded=1}
  if(d.started&&!d.phase)d.phase='sum';retag();mon=today().slice(0,7);home=!d.started;ready=true;save();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}

}

  var tp=ev.target.closest('[data-tip]');if(tp){document.getElementById(tp.dataset.tg).textContent=tp.dataset.tip;tp.parentNode.querySelectorAll('.on').forEach(function(r){r.classList.remove('on')});tp.classList.add('on');return}

  else if(a==='discard'){if(pend==='disc'){S.draft=nd();S.editing=null;home=true;pend=null;ops={};save()}else pend='disc';render()}
  else if(a==='day'){sd=b.dataset.v;render()}
  else if(a==='perfil'){tab='perfil';render();window.scrollTo(0,0)}
  else if(a==='goto'){tab=b.dataset.t;render();window.scrollTo(0,0)}
  else if(a==='exp')exportData();
  else if(a==='cpy'){var t3=document.getElementById('bk');t3.value=JSON.stringify({sessions:S.sessions});t3.select();try{navigator.clipboard.writeText(t3.value).then(function(){toast('Copiado')},function(){})}catch(e){}}
  else if(a==='imt')importText(document.getElementById('bk').value);
  else if(a==='run'){var dr=S.draft;dr.phase='run';dr.guided=true;dr.ci=0;dr.cj=0;dr.rs=0;dr.t0=Date.now();dr.exercises.forEach(function(e){e.sets.forEach(function(x){x.done=false})});save();render();window.scrollTo(0,0)}
  else if(a==='mvup'||a==='mvdn'){var xs=S.draft.exercises,k2=a==='mvup'?i-1:i+1;if(k2>=0&&k2<xs.length){var tm=xs[i];xs[i]=xs[k2];xs[k2]=tm;save();render()}}
  else if(a==='done'){var d2=S.draft,e2=d2.exercises[d2.ci||0],s2=e2.sets[d2.cj||0],r2=num(s2.r),w2=num(s2.w);if(!(r2>=1&&r2<=100)){toast('Pon las repeticiones (de 1 a 100)');return}if(w2<0||w2>1000){toast('Revisa el peso');return}s2.r=String(Math.round(r2));s2.done=true;d2.rs=Date.now();d2.cj=(d2.cj||0)+1;save();render();window.scrollTo(0,0)}
  else if(a==='step'){var s3=S.draft.exercises[S.draft.ci||0].sets[S.draft.cj||0],f3=b.dataset.f,v3=Math.max(0,num(s3[f3])+parseFloat(b.dataset.d));s3[f3]=f3==='w'?fmt(Math.round(v3*2)/2):String(Math.round(v3));save();render()}
  else if(a==='rfail'){var s4=S.draft.exercises[S.draft.ci||0].sets[S.draft.cj||0];s4.f=!s4.f;save();render()}

  else if(a==='prevset'){var d7=S.draft,e7=d7.exercises[d7.ci||0];if((d7.cj||0)>0)d7.cj=Math.min(d7.cj,e7.sets.length)-1;else if((d7.ci||0)>0){d7.ci--;e7=d7.exercises[d7.ci];d7.cj=e7.sets.length-1}e7.sets[d7.cj].done=false;save();render()}

  else if(a==='finishnow'){if(!S.draft.exercises.some(function(e){return e.sets.some(function(x){return x.done})})){toast('Termina al menos una serie');return}finish()}
  else if(a==='sum'){S.draft.phase='sum';save();render();window.scrollTo(0,0)}
  else if(a==='torun'){S.draft.phase='run';save();render();window.scrollTo(0,0)}

  else if(a==='obsave'){var pl2={},any=false,bad=false;for(var q2=0;q2<7;q2++){var x2=ob.days[q2];if(x2){any=true;if(!String(x2.n).trim())bad=true;pl2[q2]={n:String(x2.n).trim(),g:x2.g.slice()}}else pl2[q2]=null}if(!any){toast('Elige al menos un día de entreno');return}if(bad){toast('Pon nombre a todas las sesiones');return}S.name=ob.name;S.plan=pl2;S.onb=1;ob=null;retag();save();home=!S.draft.started;render();window.scrollTo(0,0);toast('Rutina guardada')}
  else if(a==='editob'){obInit();render();window.scrollTo(0,0)}
  else if(a==='upd'){try{caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(function(){return navigator.serviceWorker.getRegistrations()}).then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}).then(function(){location.reload()}).catch(function(){location.reload()})}catch(e){location.reload()}}
  else if(a==='lf'){lf=b.dataset.v;render()}
  else if(a==='finish')finish();
  else if(a==='tog'){open[id]=!open[id];pend=null;render()}
  else if(a==='edit'){s=S.sessions.find(function(x){return x.id===id});S.draft={date:s.date,exercises:copy(s.exercises),tipo:tipoOf(s),started:true,phase:'sum',guided:false};home=false;S.editing=id;ops={};save();tab='hoy';render();window.scrollTo(0,0)}
  else if(a==='rep'){s=S.sessions.find(function(x){return x.id===id});copy(s.exercises).forEach(function(e){e.sets.forEach(function(t){t.a='';t.o=''});S.draft.exercises.push(e)});S.draft.started=true;S.draft.phase=S.draft.phase||'sum';S.draft.tipo=S.draft.tipo||tipoOf(s);home=false;save();tab='hoy';render();toast('Ejercicios copiados a hoy')}
  else if(a==='del'){if(pend===id){S.sessions=S.sessions.filter(function(x){return x.id!==id});pend=null;save()}else pend=id;render()}
  else if(a==='mp'){mon=shift(mon,-1);render()}
  else if(a==='mn'){mon=shift(mon,1);render()}
