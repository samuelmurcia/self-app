<style>
:root{--bg:#0a0a0b;--card:#151517;--ink:#f2f2f3;--mute:#8b8b92;--line:#26262a;--field:#1f1f22;--acc:#ececee;--accink:#0a0a0b;--ok:#79d49a;--up:#79d49a;--dn:#ff7a6e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}

.sh,.set{display:grid;grid-template-columns:20px 1fr 1fr .7fr 38px;gap:6px;align-items:center}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,10,11,.92);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;text-align:center}

.ach:first-child{border-top:0}
.ic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--field);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.am{flex:1;min-width:0}.am b{display:block;font-weight:600;font-size:15px}.am small,.dt{color:var(--mute);font-size:13px}.dt{white-space:nowrap}

.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mute)}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}

.mnav h2{text-transform:capitalize}
.svg{width:100%;height:auto;display:block}
.bar{fill:var(--field);cursor:pointer}.bar.on{fill:var(--acc)}
.ax{fill:var(--mute);font-size:9px;text-anchor:middle}
.ln{fill:none;stroke:var(--ink);stroke-width:2}
.pt{fill:var(--card);stroke:var(--ink);stroke-width:2;cursor:pointer}.pt.on{fill:var(--ink)}
.tip{min-height:22px;color:var(--mute);font-size:14px;margin:6px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.top .ghost{padding-left:0}
.brand2{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
.prof{width:46px;height:46px;border-radius:50%;background:var(--field);border:0;color:var(--ink);display:flex;align-items:center;justify-content:center}
.lab{font-size:12px;letter-spacing:.08em;color:var(--mute);margin:0 0 4px;text-transform:uppercase}
.hero{padding:18px}.hr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big2{font-size:26px;margin:0}
.hi{flex:none;width:56px;height:56px;border-radius:14px;background:var(--field);display:flex;align-items:center;justify-content:center}
.hl{height:1px;background:var(--line);margin:16px 0}
.hm{margin:0 0 14px}.hm b{font-size:20px;font-weight:600}
.vol{font-size:26px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;min-width:0}
.day b{font-size:17px;color:var(--ink);font-weight:600}
.day.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}.day.on b{color:var(--accink)}
.dot{width:6px;height:6px;border-radius:50%;display:block}
.dot.f{background:currentColor}.dot.r{border:1.5px solid currentColor}.dot.z{width:8px;height:2px;border-radius:2px;background:currentColor;opacity:.5}
.lbl{display:inline-flex;align-items:center;cursor:pointer}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:16px;margin-bottom:8px;text-align:left}
.opt small{color:var(--mute);font-weight:400}.opt.pl{border-color:var(--ink)}
.prog{display:flex;gap:4px;margin:6px 0 10px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}.prog i.ok{background:var(--ok)}.prog i.cur{background:var(--ink)}
.rest{color:var(--mute);font-size:14px;margin:0 0 8px;min-height:20px}
.run{padding:16px}
.gin{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 12px}
.gin label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.stp{display:grid;grid-template-columns:40px 1fr 40px;gap:4px;align-items:center}
.stp button{height:56px;border-radius:12px;border:0;background:var(--field);color:var(--ink);font-size:22px;padding:0}
.stp input{height:56px;text-align:center;font-size:26px;font-weight:700;width:100%}
.row2{display:flex;gap:8px;margin-bottom:8px}.row2 input{flex:1;height:44px;padding:0 12px;font-size:16px}
.oin{width:100%;height:44px;padding:0 12px;font-size:15px}
.wide{width:100%;margin-bottom:8px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.mv{display:flex;flex-shrink:0}
.hm2{display:flex;justify-content:space-between;gap:12px}.hm2 .rt{text-align:right}
.mb{display:grid;grid-template-columns:106px 1fr 38px;gap:8px;align-items:center;padding:8px 0;cursor:pointer}
.ml{font-size:14px}.mv2{text-align:right;font-weight:600}
.trk{position:relative;height:10px;background:var(--field);border-radius:5px;overflow:hidden}
.band{position:absolute;top:0;bottom:0;left:41.7%;width:41.6%;background:var(--line)}
.fil{position:absolute;top:0;bottom:0;left:0;background:var(--ink);border-radius:5px}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Secciones"><button data-t="hoy">Entreno</button><button data-t="hist">Historial</button><button data-t="logr">Logros</button><button data-t="mes">Estadísticas</button></nav>
<script>
var K='gym.v1',S={sessions:[],routines:[],draft:null,editing:null},tab='hoy',open={},ops={},pend=null,msg='',mon='';
var SEED=[];
var DB='self',tmr=null,ready=false;
function idb(m,k,v){return new Promise(function(res,rej){try{var q=indexedDB.open(DB,1);q.onupgradeneeded=function(){q.result.createObjectStore('kv')};q.onerror=function(){rej(q.error)};q.onsuccess=function(){var d=q.result,t=d.transaction('kv',m==='get'?'readonly':'readwrite'),s=t.objectStore('kv'),r=m==='get'?s.get(k):s.put(v,k);t.oncomplete=function(){d.close();res(r.result)};t.onerror=function(){rej(t.error)}}}catch(e){rej(e)}})}
function lsGet(){try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}}
function apply(o){if(o&&Array.isArray(o.sessions)){S.sessions=o.sessions;S.draft=o.draft||null;S.editing=o.editing||null;S.seeded=o.seeded||0;S.lb=o.lb||'';S.ts=o.ts||0}}
function load(){return idb('get','state').catch(function(){return null}).then(function(a){var b=lsGet();apply(a&&b?((b.ts||0)>(a.ts||0)?b:a):(a||b));fin()})}
function fin(){if(!S.draft)S.draft=nd();var d=S.draft;if(d.started===undefined)d.started=d.exercises.length>0;if(d.tipo===undefined)d.tipo='';
  if(!S.seeded){var have={};S.sessions.forEach(function(s){have[s.id]=1});SEED.forEach(function(s){if(!have[s.id])S.sessions.push(s)});S.seeded=1}
  if(d.started&&!d.phase)d.phase='sum';mon=today().slice(0,7);home=!d.started;ready=true;save();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
function snap(){S.ts=Date.now();return JSON.stringify({sessions:S.sessions,draft:S.draft,editing:S.editing,seeded:S.seeded,lb:S.lb||'',ts:S.ts})}
function save(){var j=snap();try{localStorage.setItem(K,j)}catch(e){}clearTimeout(tmr);tmr=setTimeout(flush,200)}
function flush(){clearTimeout(tmr);if(!ready)return Promise.resolve();return idb('put','state',JSON.parse(snap())).catch(function(){})}

function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nd(){return{date:today(),exercises:[],tipo:'',started:false}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fd(i){return new Date(i+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n}
function fmt(n){return String(n).replace('.',',')}
function st(s){return (s.r||0)+'×'+(s.w||0)+(num(s.a)?' +'+s.a:'')+(s.f?' F':'')}
function names(){var m={};S.sessions.concat([S.draft]).forEach(function(s){s.exercises.forEach(function(e){m[e.name.trim()]=1})});return Object.keys(m).sort()}
function last(name){var n=name.trim().toLowerCase(),b=null;S.sessions.forEach(function(s){if(s.id===S.editing)return;s.exercises.forEach(function(e){if(e.name.trim().toLowerCase()===n&&(!b||s.date>=b.date))b={date:s.date,sets:e.sets}})});return b}
function mk(n){var l=last(n);return{name:n,sets:l&&l.sets.length?l.sets.map(function(s){return{r:s.r,w:s.w,a:'',o:''}}):[{r:'',w:'',a:'',o:''}]}}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function copy(o){return JSON.parse(JSON.stringify(o))}
function inp(f,i,j,v,m,al,ph){return'<input type="text" inputmode="'+m+'" data-f="'+f+'" data-i="'+i+'" data-j="'+j+'" value="'+esc(v)+'" aria-label="'+al+' de la serie '+(j+1)+'"'+(ph?' placeholder="'+ph+'"':'')+'>'}

var lf='all',pe='',sd=null,home=true,step='',rg='3m',rt=null,wlk=null,RG={'1m':30,'3m':91,'6m':182,'1a':365,'all':99999},TIPOS=['Empuje','Tirón','Pierna','Brazo','Pecho y espalda'],PLAN={1:'Empuje',2:'Tirón',3:'Pierna',4:'Brazo',5:'Pecho y espalda'},HV={'Empuje':'empujar','Tirón':'tirar','Pierna':'pierna','Brazo':'brazo','Pecho y espalda':'pecho y espalda'},DN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function nz(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function tipoOf(s){if(s.tipo)return s.tipo;var c={l:0,b:0,p:0,a:0};s.exercises.forEach(function(e){var n=nz(e.name);if(/cuadriceps|hack|prensa|abductor|femoral|gemelo|peso muerto|sentadilla/.test(n))c.l++;else if(/jalon|dominad|remo|pull over/.test(n))c.b++;else if(/inclinado|plano|peck|cruce/.test(n))c.p++;else if(/curl|martillo|triceps|katana|militar|lateral|trasnuca/.test(n))c.a++});
  if(c.l>=2&&c.l>=c.b+c.p)return'Pierna';if(c.b&&c.p)return'Pecho y espalda';if(c.b)return'Tirón';if(c.p)return'Empuje';if(c.a)return'Brazo';return c.l?'Pierna':'Libre'}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addd(i,n){var d=new Date(i+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function mon0(i){var d=new Date(i+'T12:00:00');return addd(i,-((d.getDay()+6)%7))}
function wd(i){return new Date(i+'T12:00:00').getDay()}
function typeList(t){return S.sessions.filter(function(s){return tipoOf(s)===t}).sort(function(a,b){return b.date.localeCompare(a.date)||b.id-a.id})}
function sugg(t){var ss=typeList(t).slice(0,6),c={},p={};ss.forEach(function(s){s.exercises.forEach(function(e,i){var k=e.name.trim();c[k]=(c[k]||0)+1;p[k]=(p[k]||0)+i})});return Object.keys(c).filter(function(k){return c[k]*2>=ss.length}).sort(function(a,b){return p[a]/c[a]-p[b]/c[b]})}
function sStats(s){var r={n:0,v:0,r:0};s.exercises.forEach(function(e){e.sets.forEach(function(x){if(!(num(x.r)||num(x.w)))return;r.n++;r.v+=num(x.r)*num(x.w);r.r+=num(x.r)})});return r}
function ago(i){var n=Math.round((new Date(today()+'T12:00:00')-new Date(i+'T12:00:00'))/864e5);return n<=0?'hoy':n===1?'ayer':'hace '+n+' días'}
function tl(lab,a,b,f){return'<div class="tile"><small>'+lab+'</small><b>'+f(a)+'</b>'+(b===undefined?'':dl(a,b))+'</div>'}
function importText(t){try{var o=JSON.parse(t),a=Array.isArray(o)?o:o.sessions;if(!Array.isArray(a))throw 0;var have={},n=0,sk=0;S.sessions.forEach(function(s){have[s.id]=1});a.forEach(function(s){if(s&&s.id&&/^\d{4}-\d{2}-\d{2}$/.test(s.date)&&Array.isArray(s.exercises)&&!have[s.id]){S.sessions.push(s);have[s.id]=1;n++}else sk++});save();flush();render();toast(n+' sesiones importadas'+(sk?' ('+sk+' ya estaban o no eran válidas)':''))}catch(e){toast('El archivo no es una copia válida')}}
function exportData(){var j=JSON.stringify({app:'SELF.',version:2,exportedAt:new Date().toISOString(),sessions:S.sessions}),nm='self-copia-'+today()+'.json';
  function mark(){S.lb=today();save();render();toast('Copia exportada')}
  function dl(){var u=URL.createObjectURL(new Blob([j],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=nm;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);mark()}
  try{var f=new File([j],nm,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'SELF.'}).then(mark).catch(function(e){if(!e||e.name!=='AbortError')dl()});return}}catch(e){}
  dl()}
function wsum(){var o={};S.sessions.forEach(function(s){var k=mon0(s.date),r=o[k]=o[k]||{k:k,n:0,s:0,v:0};r.n++;s.exercises.forEach(function(e){e.sets.forEach(function(x){r.s++;r.v+=num(x.r)*num(x.w)})})});return o}
function tiles3(c,p){return'<div class="tiles"><div class="tile"><small>Entrenos</small><b>'+c.n+'</b>'+dl(c.n,p.n)+'</div><div class="tile"><small>Series</small><b>'+c.s+'</b>'+dl(c.s,p.s)+'</div><div class="tile"><small>Volumen, kg</small><b>'+Math.round(c.v).toLocaleString('es-ES')+'</b>'+dl(c.v,p.v)+'</div></div>'}
function vReg(){
  var d=S.draft,h='<div class="top"><button class="ghost" data-a="'+(d.guided?'torun':'pause')+'">‹ '+(d.guided?'Series':'Inicio')+'</button><button class="ghost" data-a="discard">'+(pend==='disc'?'¿Seguro? Descartar':'Descartar')+'</button></div><h1>'+esc(d.tipo==='Libre'?'Sesión libre':d.tipo||'Sesión')+'</h1><p class="sub">'+fd(d.date)+'</p>';
  if(S.editing)h+='<p class="note">Editando la sesión del '+fd(d.date)+'</p>';
  h+='<div class="row"><label for="date">Día</label><input type="date" id="date" value="'+d.date+'"></div>';
  if(!d.exercises.length)h+='<p class="empty">Añade un ejercicio para empezar.</p>';
